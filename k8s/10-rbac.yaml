apiVersion: v1
kind: ServiceAccount
metadata:
  name: sre-agent-sa
  namespace: sre-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sre-agent-role
  namespace: sre-demo
rules:
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sre-agent-binding
  namespace: sre-demo
subjects:
  - kind: ServiceAccount
    name: sre-agent-sa
    namespace: sre-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sre-agent-role
