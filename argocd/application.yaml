apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sre-final-project
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/123456789cm/sre-final-project-2023034442.git"
    targetRevision: main
    path: k8s
  destination:
    server: "https://kubernetes.default.svc"
    namespace: sre-demo
  ignoreDifferences:
    - group: ""
      kind: ConfigMap
      name: fault-switch
      namespace: sre-demo
      jsonPointers:
        - /data/FAIL_MODE
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
